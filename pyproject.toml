[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "purtera-evidence-mvp"
version = "0.1.0"
description = "Parser OS — Purtera evidence compiler (artifacts → atoms → graph → packets)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "sqlmodel>=0.0.16",
  "uvicorn>=0.28",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "typer>=0.12",
  "rich>=13.0",
  "python-multipart>=0.0.9",
  "rapidfuzz>=3.0",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "PyMuPDF>=1.24",
  "opencv-python-headless>=4.9",
  "Pillow>=10.0",
  "pypdfium2>=4.30",
  # v45.2: explicit deps that were transitively present in parser-os-service
  # but missed when packaging parser-os into a fresh image (e.g. parser-os-worker).
  # Domain pack loader (app/domain/loader.py) and pack router use PyYAML.
  "PyYAML>=6.0",
  "httpx>=0.27",
  "requests>=2.31",
  "jsonschema>=4.23",
  # Outlook .msg parsing (MsgParser): without it .msg files yield only a
  # placeholder atom and the email body/attachments are lost. The parser already
  # uses it when present; declare it so the prod image installs it.
  "extract-msg>=0.48",
  "striprtf>=0.0.26",
  "icalendar>=6.0",
  # Decode-layer libraries. Each is soft-imported with a working fallback, so a
  # missing one degrades quality rather than raising -- which is exactly why they
  # must be declared: the failure mode is silent. Measured against the fallbacks:
  #   python-dateutil  date coverage 9/14 -> 14/14 spellings (app/core/dates.py)
  #   pysbd            sentence splitting stops severing "Part No." from its
  #                    part number (app/core/sentences.py)
  #   puremagic        content-based routing, so a .docx named contract.pdf does
  #                    not reach the PDF parser (app/core/filetype.py)
  "python-dateutil>=2.8",
  "pysbd>=0.3.4",
  "puremagic>=1.15",
]

[project.optional-dependencies]
# Worker image installs these explicitly; declare for local dev / pip install .[ocr].
ocr = [
  "pytesseract>=0.3.10",
]
dev = [
  # pytest 9.x triggers STATUS_STACK_BUFFER_OVERRUN (0xC0000409) on Windows /
  # CPython 3.12.3 in the demo dev environment.  Cap until pytest 9 is
  # confirmed stable on Windows or CI moves to Linux containers.
  "pytest>=8.0,<9",
  "httpx>=0.28",
  # tests/test_atom_run.py monkeypatches "sentence_transformers.SentenceTransformer"
  # with an 8-dim stub, so the suite never loads a real model -- but monkeypatch
  # must IMPORT the module to replace an attribute on it, and without the package
  # installed that import raises and the test fails. It is declared here rather
  # than soft-imported because app/learning/build_atom_store.py genuinely requires
  # it at runtime; the test is stubbed, the trainer is not.
  #
  # It drags in torch and transformers. CI installs the CPU-only torch wheel first
  # (see .github/workflows/tests.yml) so this costs ~200MB rather than the ~2.5GB
  # CUDA build pip would otherwise resolve to on Linux.
  "sentence-transformers>=3.0",
]

[tool.setuptools.packages.find]
include = ["app*", "orbitbrief_page_os*"]

[tool.setuptools.package-data]
app = [
  "domain/*.yaml",
  "domain/ontology/*.yaml",
  # English wordlist for the OCR-debris gate (app/core/text_quality.py).
  "core/data/*.gz",
  # The lifecycle labels are data, not code, and setuptools ships no non-Python
  # file it is not told about. Omitting this installed the package without its
  # dataset: every lookup returned None, every document came back unclassified,
  # and nothing failed -- the envelope carried `lifecycle: null` on all 65
  # documents of a deal whose 21 documents were all in the table.
  "core/document_lifecycle/data/*.json",
]
orbitbrief_page_os = [
  "segmentation/core_runtime/chunks/*",
  "segmentation/headings/templates/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The bundled `anyio` pytest plugin triggers a native access violation
# (0xC0000409 / STATUS_STACK_BUFFER_OVERRUN) at collection time on
# CPython 3.12.3 / pytest 9.x in the Windows conda dev env — it crashes the
# interpreter before any test runs. We don't use anyio's pytest fixtures, so
# disabling just that plugin restores a clean run without capping pytest.
addopts = "-q -p no:anyio"
